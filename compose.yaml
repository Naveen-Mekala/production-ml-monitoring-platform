services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: production-ml-monitoring-api:1.0
    container_name: production-ml-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    image: production-ml-monitoring-api:1.0
    container_name: production-ml-dashboard
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    environment:
      API_BASE_URL: "http://api:8000"
    restart: unless-stopped
